<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#060D1F;
  color:#E8EFF8;
  font-family:'Inter',sans-serif;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
body::before{
  content:'';
  position:fixed;inset:0;
  background:
    radial-gradient(ellipse at 30% 20%, rgba(0,230,118,0.08) 0%, transparent 55%),
    radial-gradient(ellipse at 70% 80%, rgba(41,121,255,0.08) 0%, transparent 55%);
  pointer-events:none;
}
body::after{
  content:'';
  position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(0,230,118,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,230,118,0.025) 1px, transparent 1px);
  background-size:44px 44px;
  pointer-events:none;
}
.wrap{
  text-align:center;
  padding:32px 24px;
  position:relative;
  z-index:1;
}
.logo-img{
  width:200px;
  height:200px;
  object-fit:contain;
  display:block;
  margin:0 auto 4px;
  filter:drop-shadow(0 0 24px rgba(0,230,118,0.5)) drop-shadow(0 0 50px rgba(0,230,118,0.2));
  animation:float 4s ease-in-out infinite;
}
@keyframes float{
  0%,100%{transform:translateY(0px)}
  50%{transform:translateY(-12px)}
}
.status{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:rgba(0,230,118,0.06);
  border:1px solid rgba(0,230,118,0.15);
  border-radius:20px;
  padding:8px 20px;
  font-size:12px;
  color:#7A8FA6;
  margin-top:28px;
  letter-spacing:0.04em;
}
.dot{
  width:7px;height:7px;
  background:#00E676;
  border-radius:50%;
  flex-shrink:0;
  animation:blink 1.5s infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}
</style>
